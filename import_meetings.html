
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>انتقال گزارش‌های جلسات</title>
  <style>
    body {
      font-family: Tahoma, sans-serif;
      max-width: 750px;
      margin: 40px auto;
      padding: 20px;
      line-height: 2;
    }
    button {
      padding: 10px 18px;
      margin-top: 15px;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h2>انتقال گزارش‌های جلسات به پایگاه داده</h2>

  <p id="status">در حال بررسی ورود مدیر...</p>

  <div id="panel" hidden>
    <p>
      فقط سه فایل گزارش جلسه را انتخاب کن.
      فایل index.json را انتخاب نکن.
    </p>

    <input
      id="files"
      type="file"
      accept=".json,application/json"
      multiple
    >

    <br>

    <button id="importButton" disabled>
      انتقال گزارش‌ها
    </button>

    <div id="result"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase_client.js"></script>

  <script>
    const ADMIN_UID = "81eddee5-8203-4e5a-9eaa-e1031853d3a6";

    const status = document.getElementById("status");
    const panel = document.getElementById("panel");
    const filesInput = document.getElementById("files");
    const importButton = document.getElementById("importButton");
    const result = document.getElementById("result");

    async function checkAdmin() {
      const { data, error } =
        await supabaseClient.auth.getSession();

      if (error || !data.session) {
        status.textContent =
          "ابتدا در admin.html وارد پنل مدیریت شو؛ سپس این صفحه را باز کن.";
        return;
      }

      if (data.session.user.id !== ADMIN_UID) {
        status.textContent = "این حساب اجازهٔ انتقال گزارش‌ها را ندارد.";
        return;
      }

      status.textContent = "ورود مدیر تأیید شد.";
      panel.hidden = false;
    }

    filesInput.addEventListener("change", () => {
      importButton.disabled = filesInput.files.length === 0;
      result.textContent = "";
    });

    importButton.addEventListener("click", async () => {
      const files = Array.from(filesInput.files);

      if (files.length !== 3) {
        result.textContent =
          "لطفاً دقیقاً سه فایل گزارش جلسه انتخاب کن.";
        return;
      }

      importButton.disabled = true;
      result.textContent = "شروع انتقال...\n";

      try {
        for (const file of files) {
          const meeting = JSON.parse(await file.text());

          if (
            !meeting ||
            typeof meeting !== "object" ||
            Array.isArray(meeting)
          ) {
            throw new Error(file.name + ": ساختار JSON معتبر نیست.");
          }

          const filenameId = file.name.replace(/\.json$/i, "");
          const id = meeting.id || filenameId;

          if (id === "index") {
            throw new Error("فایل index.json گزارش جلسه نیست.");
          }

          const { error } = await supabaseClient
            .from("meetings")
            .upsert(
              {
                id: id,
                data: meeting
              },
              { onConflict: "id" }
            );

          if (error) {
            result.textContent +=
              "❌ " + file.name + ": " + error.message + "\n";
          } else {
            result.textContent +=
              "✅ " + file.name + " با شناسهٔ " + id +
              " منتقل شد.\n";
          }
        }

        result.textContent += "\nانتقال فایل‌های انتخاب‌شده تمام شد.";
      } catch (error) {
        result.textContent += "\nخطا: " + error.message;
      } finally {
        importButton.disabled = false;
      }
    });

    checkAdmin();
  </script>
</body>
</html>
