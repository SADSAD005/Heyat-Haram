<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>گزارش جلسات</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            background: #000;

            color: #fff;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            direction: rtl;
        }


        a {
            color: inherit;
            text-decoration: none;
        }


        /* ---------------- HEADER ---------------- */

        .header {

            width: 100%;
            max-width: 900px;

            height: 90px;

            margin: 0 auto;

            background: #0e6136;

            border-radius:
                0 0 25px 25px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 25px;

            font-weight: bold;

            position: sticky;

            top: 0;

            z-index: 1000;
        }


        /* ---------------- MAIN ---------------- */

        .content {

            width: 90%;

            max-width: 900px;

            margin: 40px auto;
        }


        /* ---------------- LATEST REPORT ---------------- */

        .latest-box {

            border: 1px solid #333;

            border-radius: 20px;

            padding: 22px 25px;

            background: #080808;
        }


        .latest-label {

            color: #999;

            font-size: 14px;

            margin-bottom: 10px;
        }


        .latest-title {

            font-size: 22px;

            font-weight: bold;

            margin-bottom: 12px;
        }


        .latest-meta {

            color: #aaa;

            font-size: 14px;

            line-height: 2;
        }


        /* ---------------- SEARCH ---------------- */

        .search-box {

            width: 100%;

            height: 55px;

            border: 1px solid #333;

            border-radius: 16px;

            margin-top: 25px;

            display: flex;

            align-items: center;

            padding: 0 20px;

            color: #777;

            font-size: 16px;
        }


        /* ---------------- REPORT LIST ---------------- */

        .reports-box {

            width: 100%;

            margin-top: 15px;

            border: 1px solid #333;

            border-radius: 20px;

            overflow-y: auto;

            /*
             * ارتفاع تقریبی برای ۱۰ جلسه
             */

            height: 600px;
        }


        .report-row {

            min-height: 60px;

            padding: 0 20px;

            display: grid;

            grid-template-columns:
                1fr
                2fr
                1fr;

            align-items: center;

            gap: 15px;

            border-bottom: 1px solid #222;

            transition:
                background 0.15s ease;
        }


        .report-row:last-child {
            border-bottom: none;
        }


        .report-row:hover {
            background: #0b0b0b;
        }


        .report-title {

            font-weight: bold;

            color: #fff;
        }


        .report-topic {

            color: #ccc;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        .report-date {

            color: #999;

            text-align: left;

            white-space: nowrap;
        }


        /* ---------------- EMPTY / ERROR ---------------- */

        .message {

            padding: 30px;

            text-align: center;

            color: #777;

            line-height: 2;
        }


        /* ---------------- MOBILE ---------------- */

        @media (max-width: 700px) {

            .header {

                height: 75px;

                font-size: 20px;

                border-radius:
                    0 0 20px 20px;
            }


            .content {

                width: 92%;

                margin-top: 30px;
            }


            .latest-title {

                font-size: 19px;
            }


            .reports-box {

                height: 520px;
            }


            .report-row {

                min-height: 65px;

                padding:
                    8px 15px;

                grid-template-columns:
                    1fr
                    1.5fr
                    auto;

                gap: 8px;

                font-size: 13px;
            }


            .report-topic {

                font-size: 13px;
            }


            .report-date {

                font-size: 12px;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header class="header">
        گزارش جلسات
    </header>


    <main class="content">


        <!-- LATEST REPORT -->

        <a
            href="#"
            id="latestReport"
            class="latest-box"
        >

            <div class="latest-label">
                آخرین گزارش
            </div>


            <div
                class="latest-title"
                id="latestTitle"
            >
                در حال بارگذاری...
            </div>


            <div
                class="latest-meta"
                id="latestMeta"
            >
            </div>

        </a>


        <!-- SEARCH -->

        <div class="search-box">

            جست‌وجو

        </div>


        <!-- REPORTS -->

        <div
            class="reports-box"
            id="reportsList"
        >

            <div class="message">
                در حال بارگذاری گزارش‌ها...
            </div>

        </div>


    </main>


<script>


    /* ----------------------------------------
       تبدیل اعداد انگلیسی به فارسی
       ---------------------------------------- */

    function toPersianDigits(value) {

        if (
            value === null ||
            value === undefined
        ) {
            return "";
        }


        return String(value).replace(
            /\d/g,
            digit => "۰۱۲۳۴۵۶۷۸۹"[digit]
        );
    }


    /* ----------------------------------------
       فرار دادن HTML
       ---------------------------------------- */

    function escapeHtml(value) {

        if (
            value === null ||
            value === undefined
        ) {
            return "";
        }


        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );
    }


    /* ----------------------------------------
       گرفتن شماره جلسه
       ---------------------------------------- */

    function getMeetingNumber(meeting) {

        const raw =
            meeting.id
                ? meeting.id.replace(
                    /^meeting-/,
                    ""
                )
                : "";


        if (/^\d+$/.test(raw)) {

            return String(
                parseInt(
                    raw,
                    10
                )
            );
        }


        return raw;
    }


    /* ----------------------------------------
       عنوان جلسه
       ---------------------------------------- */

    function getMeetingTitle(meeting) {

        if (
            meeting.name &&
            meeting.name.trim() !== ""
        ) {

            return meeting.name.trim();
        }


        const number =
            getMeetingNumber(meeting);


        return `جلسه شماره ${toPersianDigits(number)}`;
    }


    /* ----------------------------------------
       مرتب‌سازی جلسات
       جدیدترین → قدیمی‌ترین
       ---------------------------------------- */

    function sortMeetings(meetings) {

        return meetings.sort(
            (a, b) => {

                const numberA =
                    parseInt(
                        getMeetingNumber(a),
                        10
                    ) || 0;


                const numberB =
                    parseInt(
                        getMeetingNumber(b),
                        10
                    ) || 0;


                return numberB - numberA;
            }
        );
    }


    /* ----------------------------------------
       ساخت یک ردیف گزارش
       ---------------------------------------- */

    function createReportRow(meeting) {

        const link =
            document.createElement("a");


        link.className =
            "report-row";


        link.href =
            `report_viewer.html?id=${encodeURIComponent(meeting.id)}`;


        const title =
            getMeetingTitle(meeting);


        const firstTopic =
            meeting.topics &&
            meeting.topics.length
                ? meeting.topics[0]
                : "-";


        const date =
            meeting.datetime?.date_solar ||
            "-";


        link.innerHTML = `

            <div class="report-title">
                ${escapeHtml(title)}
            </div>

            <div class="report-topic">
                ${escapeHtml(firstTopic)}
            </div>

            <div class="report-date">
                ${toPersianDigits(date)}
            </div>

        `;


        return link;
    }


    /* ----------------------------------------
       نمایش آخرین گزارش
       ---------------------------------------- */

    function renderLatest(meeting) {

        const latestLink =
            document.getElementById(
                "latestReport"
            );


        const title =
            getMeetingTitle(meeting);


        const firstTopic =
            meeting.topics &&
            meeting.topics.length
                ? meeting.topics[0]
                : "-";


        const date =
            meeting.datetime?.date_solar ||
            "-";


        latestLink.href =
            `report_viewer.html?id=${encodeURIComponent(meeting.id)}`;


        document.getElementById(
            "latestTitle"
        ).textContent =
            title;


        document.getElementById(
            "latestMeta"
        ).innerHTML = `

            ${escapeHtml(firstTopic)}

            <br>

            ${toPersianDigits(date)}

        `;
    }


    /* ----------------------------------------
       بارگذاری گزارش‌ها
       ---------------------------------------- */

    async function loadReports() {

        const list =
            document.getElementById(
                "reportsList"
            );


        try {

            /* ------------------------------
               خواندن فهرست جلسات
               ------------------------------ */

            const indexResponse =
                await fetch(
                    "data/meetings/index.json"
                );


            if (!indexResponse.ok) {

                throw new Error(
                    "فایل index.json پیدا نشد."
                );
            }


            const index =
                await indexResponse.json();


            const meetingIds =
                index.meetings || [];


            if (!meetingIds.length) {

                list.innerHTML = `
                    <div class="message">
                        هنوز گزارشی ثبت نشده است.
                    </div>
                `;

                return;
            }


            /* ------------------------------
               خواندن تمام جلسات
               ------------------------------ */

            const responses =
                await Promise.all(

                    meetingIds.map(
                        id =>
                            fetch(
                                `data/meetings/${id}.json`
                            )
                    )
                );


            const meetings =
                await Promise.all(

                    responses.map(
                        response =>
                            response.json()
                    )
                );


            /* ------------------------------
               مرتب‌سازی
               ------------------------------ */

            sortMeetings(
                meetings
            );


            /* ------------------------------
               آخرین گزارش
               ------------------------------ */

            renderLatest(
                meetings[0]
            );


            /* ------------------------------
               لیست گزارش‌ها
               ------------------------------ */

            list.innerHTML =
                "";


            meetings.forEach(
                meeting => {

                    list.appendChild(
                        createReportRow(
                            meeting
                        )
                    );

                }
            );


        } catch (error) {

            console.error(error);


            list.innerHTML = `

                <div class="message">

                    خطا در بارگذاری گزارش‌ها

                    <br>

                    ${escapeHtml(error.message)}

                </div>

            `;
        }
    }


    loadReports();

</script>


</body>

</html>
