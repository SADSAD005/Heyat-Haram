<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سورس‌های تکلیف</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background: #000;
            color: #fff;
            font-family: Tahoma, Arial, sans-serif;
            direction: rtl;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================
           Header
        ========================= */

        .header {
            position: sticky;
            top: 0;
            z-index: 100;

            height: 74px;

            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;

            padding: 0 22px;

            background: #0e6136;
            border-radius: 0 0 18px 18px;
        }

        .header-right {
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .header-center {
            text-align: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .logo-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .logo {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        .page-title {
            font-size: 20px;
            font-weight: bold;
        }

        .back-link {
            padding: 7px 12px;

            background: rgba(255, 255, 255, 0.12);
            border-radius: 8px;

            font-size: 13px;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* =========================
           Main
        ========================= */

        .container {
            width: min(1100px, calc(100% - 30px));
            margin: 30px auto 60px;
        }

        .info-box {
            margin-bottom: 25px;
            padding: 18px 20px;

            background: #111;
            border: 1px solid #292929;
            border-radius: 14px;
        }

        .task-name {
            margin: 0 0 8px;

            font-size: 21px;
            font-weight: bold;
        }

        .member-name {
            color: #d2d4b4;
            font-size: 15px;
        }

        .source-count {
            margin-top: 10px;
            color: #999;
            font-size: 13px;
        }

        /* =========================
           Source Cards
        ========================= */

        .sources {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .source-card {
            overflow: hidden;

            background: #0c0c0c;
            border: 1px solid #292929;
            border-radius: 14px;
        }

        .source-header {
            min-height: 52px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;

            padding: 10px 16px;

            background: #151515;
            border-bottom: 1px solid #292929;
        }

        .source-title {
            min-width: 0;

            font-size: 14px;
            font-weight: bold;

            overflow-wrap: anywhere;
        }

        .source-type {
            flex-shrink: 0;

            padding: 4px 8px;

            border-radius: 6px;

            background: #d2d4b4;
            color: #111;

            font-size: 11px;
        }

        .source-body {
            padding: 18px;
        }

        /* =========================
           Image
        ========================= */

        .image-viewer {
            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 150px;
        }

        .image-viewer img {
            display: block;

            max-width: 100%;
            max-height: 75vh;

            object-fit: contain;

            border-radius: 8px;
        }

        /* =========================
           Text
        ========================= */

        .text-viewer {
            margin: 0;

            padding: 18px;

            background: #050505;
            border: 1px solid #242424;
            border-radius: 8px;

            direction: rtl;
            text-align: right;

            white-space: pre-wrap;
            overflow-wrap: anywhere;

            font-family: Tahoma, Arial, sans-serif;
            font-size: 14px;
            line-height: 2;

            overflow-x: auto;
        }

        /* =========================
           PDF
        ========================= */

        .pdf-viewer {
            width: 100%;
            height: 75vh;

            border: 0;
            border-radius: 8px;

            background: #222;
        }

        /* =========================
           Generic / Excel
        ========================= */

        .file-info {
            padding: 25px;

            text-align: center;

            background: #080808;
            border: 1px solid #242424;
            border-radius: 10px;
        }

        .file-icon {
            margin-bottom: 12px;

            font-size: 42px;
        }

        .file-name {
            margin-bottom: 16px;

            overflow-wrap: anywhere;

            color: #ddd;
            font-size: 14px;
        }

        .file-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 9px 16px;

            background: #0e6136;
            border-radius: 8px;

            font-size: 13px;
        }

        .file-button:hover {
            background: #147a46;
        }

        .file-note {
            margin-top: 12px;

            color: #888;
            font-size: 12px;
            line-height: 1.8;
        }

        /* =========================
           Loading / Error / Empty
        ========================= */

        .message {
            padding: 30px;

            text-align: center;

            background: #111;
            border: 1px solid #292929;
            border-radius: 14px;

            color: #aaa;
            line-height: 2;
        }

        .error {
            border-color: #5b2424;
            color: #e7a0a0;
        }

        /* =========================
           Mobile
        ========================= */

        @media (max-width: 700px) {

            .header {
                height: 64px;
                padding: 0 12px;
            }

            .logo {
                width: 38px;
                height: 38px;
            }

            .page-title {
                font-size: 16px;
            }

            .back-link {
                padding: 6px 8px;
                font-size: 11px;
            }

            .container {
                width: calc(100% - 20px);
                margin-top: 20px;
            }

            .info-box {
                padding: 15px;
            }

            .task-name {
                font-size: 18px;
            }

            .source-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 7px;
            }

            .source-body {
                padding: 10px;
            }

            .pdf-viewer {
                height: 70vh;
            }

            .image-viewer img {
                max-height: 65vh;
            }
        }

    /* =========================
   Source Navigation
========================= */

.source-navigation {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;

    margin: 0 0 22px;

    direction: ltr;
}

.source-navigation.bottom {
    margin: 22px 0 0;
}

.source-nav-button {
    min-width: 42px;
    height: 38px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    padding: 0 10px;

    background: #151515;
    border: 1px solid #292929;
    border-radius: 8px;

    color: #fff;

    font-family: Arial, sans-serif;
    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    transition:
        background 0.15s ease,
        transform 0.15s ease;
}

.source-nav-button:hover:not(:disabled) {
    background: #0e6136;
    transform: translateY(-1px);
}

.source-nav-button:disabled {
    opacity: 0.35;
    cursor: default;
}

.source-nav-position {
    min-width: 90px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    height: 38px;

    padding: 0 12px;

    background: #d2d4b4;
    color: #111;

    border-radius: 8px;

    font-size: 13px;
    font-weight: bold;

    direction: rtl;
}
    </style>
</head>

<body>

<header class="header">

    <div class="header-right">
        <a href="main.html"
           class="logo-link"
           title="صفحه اصلی">
            <img
                src="logo_warm.png"
                alt="لوگو"
                class="logo"
            >
        </a>
    </div>

    <div class="header-center">
        <div class="page-title">
            سورس‌های تکلیف
        </div>
    </div>

    <div class="header-left">
    </div>

</header>


<main class="container">

    <section
        id="infoBox"
        class="info-box"
        style="display:none;"
    >
        <h1
            id="taskName"
            class="task-name"
        >
            -
        </h1>

        <div
            id="memberName"
            class="member-name"
        >
            -
        </div>

        <div
            id="sourceCount"
            class="source-count"
        >
            -
        </div>
    </section>


    <section
        id="content"
        class="message"
    >
        در حال بارگذاری...
    </section>

</main>


<script>

    /* =====================================================
       Helpers
    ===================================================== */

    function getQueryParam(name) {

        const params =
            new URLSearchParams(
                window.location.search
            );

        return params.get(name);
    }

    function toPersianDigits(value) {

    return String(value)
        .replace(/\d/g, digit => {
            return "۰۱۲۳۴۵۶۷۸۹"[digit];
        });
}


    function escapeHtml(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    function getFileName(path) {

        if (!path) {
            return "فایل";
        }

        const cleanPath =
            path.split("?")[0];

        return decodeURIComponent(
            cleanPath
                .split("/")
                .pop()
        );
    }


    function getExtension(path) {

        const fileName =
            getFileName(path);

        const index =
            fileName.lastIndexOf(".");

        if (index === -1) {
            return "";
        }

        return fileName
            .substring(index + 1)
            .toLowerCase();
    }


    function getSourceType(source) {

        const type =
            String(source?.type || "")
                .toLowerCase()
                .trim();

        if (type) {
            return type;
        }

        const extension =
            getExtension(source?.url);

        if (
            ["jpg", "jpeg", "png", "gif", "webp", "bmp", "svg"]
                .includes(extension)
        ) {
            return "image";
        }

        if (
            ["txt", "text"].includes(extension)
        ) {
            return "text";
        }

        if (extension === "pdf") {
            return "pdf";
        }

        if (
            ["xls", "xlsx", "xlsm", "csv"]
                .includes(extension)
        ) {
            return "excel";
        }

        return "file";
    }


    function getTypeTitle(type) {

        switch (type) {

            case "image":
                return "تصویر";

            case "text":
            case "txt":
                return "متن";

            case "pdf":
                return "PDF";

            case "excel":
            case "xlsx":
            case "xls":
                return "Excel";

            default:
                return "فایل";
        }
    }


    function createSourceNavigation(
    currentIndex,
    total,
    position,
    onNavigate
) {

    const navigation =
        document.createElement("div");

    navigation.className =
        `source-navigation ${position || ""}`;


    const firstButton =
        document.createElement("button");

    firstButton.className =
        "source-nav-button";

    firstButton.type =
        "button";

    firstButton.textContent =
        "<<";

    firstButton.title =
        "اولین فایل";


    const previousButton =
        document.createElement("button");

    previousButton.className =
        "source-nav-button";

    previousButton.type =
        "button";

    previousButton.textContent =
        "<";

    previousButton.title =
        "فایل قبلی";


    const positionLabel =
        document.createElement("div");

    positionLabel.className =
        "source-nav-position";

    positionLabel.textContent =
        `${toPersianDigits(currentIndex + 1)} از ${toPersianDigits(total)}`;


    const nextButton =
        document.createElement("button");

    nextButton.className =
        "source-nav-button";

    nextButton.type =
        "button";

    nextButton.textContent =
        ">";

    nextButton.title =
        "فایل بعدی";


    const lastButton =
        document.createElement("button");

    lastButton.className =
        "source-nav-button";

    lastButton.type =
        "button";

    lastButton.textContent =
        ">>";

    lastButton.title =
        "آخرین فایل";


    firstButton.disabled =
        currentIndex === 0;

    previousButton.disabled =
        currentIndex === 0;

    nextButton.disabled =
        currentIndex === total - 1;

    lastButton.disabled =
        currentIndex === total - 1;


    firstButton.addEventListener(
    "click",
    () => onNavigate(0)
);

previousButton.addEventListener(
    "click",
    () => onNavigate(currentIndex - 1)
);

nextButton.addEventListener(
    "click",
    () => onNavigate(currentIndex + 1)
);

lastButton.addEventListener(
    "click",
    () => onNavigate(total - 1)
);


    navigation.appendChild(
        firstButton
    );

    navigation.appendChild(
        previousButton
    );

    navigation.appendChild(
        positionLabel
    );

    navigation.appendChild(
        nextButton
    );

    navigation.appendChild(
        lastButton
    );


    return navigation;
}

    function resolveSourceUrl(url) {
        if (!url) {
            return "";
        }

        return `data/tasks/${url}`;
    }


    /* =====================================================
       Render Source
    ===================================================== */

    async function renderSource(
        source,
        index
    ) {

        const path =
            source?.url;

        const sourceUrl =
            resolveSourceUrl(path);

        if (!path) {

            return `
                <article class="source-card">

                    <div class="source-header">
                        <div class="source-title">
                            فایل ${index + 1}
                        </div>

                        <div class="source-type">
                            نامشخص
                        </div>
                    </div>

                    <div class="source-body">

                        <div class="message error">
                            مسیر فایل مشخص نشده است.
                        </div>

                    </div>

                </article>
            `;
        }


        const type =
            getSourceType(source);

        const fileName =
            getFileName(path);

        const typeTitle =
            getTypeTitle(type);


        let body = "";


        /* =========================
           Image
        ========================= */

        if (type === "image") {

            body = `
                <div class="image-viewer">

                    <img
                        src="${escapeHtml(sourceUrl)}"
                        alt="${escapeHtml(fileName)}"
                        loading="lazy"
                    >

                </div>
            `;
        }


        /* =========================
           Text
        ========================= */

        else if (
    type === "text" ||
    type === "txt"
) {

    try {

        console.log("TXT URL:", sourceUrl);

        const response =
            await fetch(sourceUrl);

        console.log(
            "TXT response:",
            response.status,
            response.statusText
        );

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status} - ${response.statusText}`
            );
        }

        const text =
            await response.text();

        console.log("TXT content:", text);

        body = `
            <pre class="text-viewer">${escapeHtml(text)}</pre>
        `;

    } catch (error) {

        console.error(
            "خطای خواندن TXT:",
            error
        );

        body = `
            <div class="message error">
                خطا در خواندن فایل متنی:
                <br><br>
                ${escapeHtml(error.message)}
            </div>
        `;
    }
}


        /* =========================
           PDF
        ========================= */

        else if (type === "pdf") {

            body = `
                <iframe
                    class="pdf-viewer"
                    src="${escapeHtml(sourceUrl)}"
                    title="${escapeHtml(fileName)}"
                ></iframe>

                <div
                    style="
                        margin-top:10px;
                        text-align:center;
                    "
                >
                    <a
                        class="file-button"
                        href="${escapeHtml(sourceUrl)}"
                        target="_blank"
                        rel="noopener"
                    >
                        باز کردن PDF در پنجره جدید
                    </a>
                </div>
            `;
        }


        /* =========================
           Excel
        ========================= */

        else if (
            type === "excel" ||
            type === "xlsx" ||
            type === "xls"
        ) {

            body = `
                <div class="file-info">

                    <div class="file-icon">
                        📊
                    </div>

                    <div class="file-name">
                        ${escapeHtml(fileName)}
                    </div>

                    <a
                        class="file-button"
                        href="${escapeHtml(sourceUrl)}"
                        target="_blank"
                        rel="noopener"
                    >
                        باز کردن فایل Excel
                    </a>

                    <div class="file-note">
                        نمایش جدولی مستقیم فایل‌های Excel
                        را در مرحله بعد به نمایشگر اضافه می‌کنیم.
                    </div>

                </div>
            `;
        }


        /* =========================
           Unknown / Generic File
        ========================= */

        else {

            body = `
                <div class="file-info">

                    <div class="file-icon">
                        📎
                    </div>

                    <div class="file-name">
                        ${escapeHtml(fileName)}
                    </div>

                    <a
                        class="file-button"
                        href="${escapeHtml(sourceUrl)}"
                        target="_blank"
                        rel="noopener"
                    >
                        باز کردن فایل
                    </a>

                </div>
            `;
        }


        return `
            <article class="source-card">

                <div class="source-header">

                    <div class="source-title">
                        ${escapeHtml(fileName)}
                    </div>

                    <div class="source-type">
                        ${escapeHtml(typeTitle)}
                    </div>

                </div>

                <div class="source-body">
                    ${body}
                </div>

            </article>
        `;
    }


    /* =====================================================
       Load Members
    ===================================================== */

    async function loadMembers() {

        const response =
            await fetch(
                "data/members.json"
            );

        if (!response.ok) {
            throw new Error(
                "فایل اعضا پیدا نشد."
            );
        }

        const data =
            await response.json();

        return Array.isArray(data.members)
            ? data.members
            : [];
    }


    /* =====================================================
       Load Task
    ===================================================== */

    async function loadTask(taskId) {

        const response =
            await fetch(
                `data/tasks/${encodeURIComponent(taskId)}.json`
            );

        if (!response.ok) {

            throw new Error(
                `فایل تکلیف ${taskId} پیدا نشد.`
            );
        }

        return await response.json();
    }


    /* =====================================================
       Main
    ===================================================== */

    async function init() {

        const taskId =
            getQueryParam("task");

        const memberId =
            getQueryParam("member");


        const content =
            document.getElementById(
                "content"
            );

        const infoBox =
            document.getElementById(
                "infoBox"
            );


        if (!taskId || !memberId) {

            content.className =
                "message error";

            content.innerHTML = `
                پارامترهای لازم برای نمایش
                سورس مشخص نشده‌اند.
            `;

            return;
        }


        try {

            const [
                task,
                members
            ] = await Promise.all([
                loadTask(taskId),
                loadMembers()
            ]);


            const member =
                members.find(
                    item =>
                        item.id === memberId
                );


            const participant =
                Array.isArray(task.participants)
                    ? task.participants.find(
                        item =>
                            item.member === memberId
                    )
                    : null;


            const allSources = [];

if (Array.isArray(task.participants)) {

    task.participants.forEach(participant => {

        if (!Array.isArray(participant.sources)) {
            return;
        }

        participant.sources.forEach(source => {

            allSources.push({
                ...source,
                member: participant.member
            });

        });

    });
}

            /* =========================
               Page Info
            ========================= */

            document.getElementById(
                "taskName"
            ).textContent =
                task.name ||
                `تکلیف شماره ${task.number ?? "-"}`;


            document.getElementById(
                "memberName"
            ).textContent =
                member?.display_name ||
                member?.name ||
                memberId;


            document.getElementById(
                 "sourceCount"
            ).textContent =
           `${toPersianDigits(allSources.length)} فایل سورس`;


            infoBox.style.display =
                "block";


            /* =========================
               No Sources
            ========================= */

            if (!allSources.length) {

                content.className =
                    "message";

                content.innerHTML =
                    "برای این فرد سورسی ثبت نشده است.";

                return;
            }


            /* =========================
               Render All Sources
            ========================= */

            async function showSource(index) {

    if (
        index < 0 ||
        index >= allSources.length
    ) {
        return;
    }

    const currentSource =
        allSources[index];


    content.className =
        "sources";

    content.innerHTML =
        "";


    /* =========================
       Member of Current Source
    ========================= */

    const currentMember =
        members.find(
            item =>
                item.id === currentSource.member
        );


    document.getElementById(
        "memberName"
    ).textContent =
        currentMember?.display_name ||
        currentMember?.name ||
        currentSource.member;


    /* =========================
       Top Navigation
    ========================= */

    const topNavigation =
    createSourceNavigation(
        index,
        allSources.length,
        "top",
        showSource
    );

    content.appendChild(
        topNavigation
    );


    /* =========================
       Current Source
    ========================= */

    const html =
        await renderSource(
            currentSource,
            index
        );

    content.insertAdjacentHTML(
        "beforeend",
        html
    );


    /* =========================
       Bottom Navigation
    ========================= */

    const bottomNavigation =
    createSourceNavigation(
        index,
        allSources.length,
        "bottom",
        showSource
    );

    content.appendChild(
        bottomNavigation
    );
}


const initialIndex =
    allSources.findIndex(
        source =>
            source.member === memberId
    );

await showSource(
    initialIndex >= 0
        ? initialIndex
        : 0
);
            

        } catch (error) {

            console.error(error);

            content.className =
                "message error";

            content.innerHTML = `
                خطا در بارگذاری سورس.

                <br><br>

                ${escapeHtml(
                    error.message
                )}
            `;
        }
    }


    init();

</script>

</body>
</html>
