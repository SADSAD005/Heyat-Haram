<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>گزارش جلسه</title>

    <link rel="stylesheet" href="css/report_viewer.css" >


</head>


<body>


    <!-- ==============================
         HEADER
    ============================== -->

    <header class="header">

        <a href="main.html"
           class="logo-link"
           title="صفحه اصلی">

            <img src="logo_warm.png"
                 alt="لوگو"
                 class="logo">

        </a>


        <div class="meeting-title"
             id="meetingTitle">
            در حال بارگذاری...
        </div>


        <div class="meeting-date"
             id="meetingDate">
            -
        </div>

    </header>



    <main class="content">


        <!-- ==============================
             DATE / TIME
        ============================== -->

        <section class="date-box">

            <div class="date-item">

                <div class="date-label">
                    تاریخ شمسی
                </div>

                <div class="date-value"
                     id="solarDate">
                    -
                </div>

            </div>


            <div class="date-item">

                <div class="date-label">
                    تاریخ قمری
                </div>

                <div class="date-value"
                     id="lunarDate">
                    -
                </div>

            </div>


            <div class="date-item">

                <div class="date-label">
                    ساعت شروع
                </div>

                <div class="date-value"
                     id="startTime">
                    -
                </div>

            </div>


            <div class="date-item">

                <div class="date-label">
                    ساعت پایان
                </div>

                <div class="date-value"
                     id="endTime">
                    -
                </div>

            </div>


            <div class="date-item">

                <div class="date-label">
                    مدت جلسه
                </div>

                <div class="date-value"
                     id="totalDuration">
                    -
                </div>

            </div>


            <div class="date-item">

                <div class="date-label">
                    مدت مفید
                </div>

                <div class="date-value"
                     id="usefulDuration">
                    -
                </div>

            </div>

        </section>



        <!-- ==============================
             TOPICS
        ============================== -->

        <section class="section">

            <div class="section-title">
                موضوعات
            </div>

            <div class="topics"
                 id="topics">
                -
            </div>

        </section>


        <div class="separator"></div>



        <!-- ==============================
             DESCRIPTION
        ============================== -->

        <section>

            <div class="description"
                 id="description">
                -
            </div>

        </section>



        <!-- ==============================
             MEETING INFO
        ============================== -->

        <section class="accordion"
                 id="meetingInfoAccordion">

            <div class="accordion-header">

                <div class="accordion-title">

                    جلسه گردان:
                    <span id="moderatorName">-</span>

                </div>

                <div class="arrow">
                    ▼
                </div>

            </div>


            <div class="accordion-content">


                <div>

                    <div class="member-label">

                        حضار
                        (<span id="presentCount">۰</span> نفر)

                    </div>


                    <div class="members"
                         id="attendees">
                    </div>

                </div>



                <div style="margin-top:25px;">

                    <div class="member-label">
                        کاتب
                    </div>


                    <div class="members"
                         id="secretary">
                    </div>

                </div>

            </div>

        </section>



        <!-- ==============================
             MINUTES
        ============================== -->

        <section class="section">

            <div class="section-title">
                صورت جلسه
            </div>

            <div class="description"
                 id="minutes">
                -
            </div>

        </section>


        <div class="separator"></div>



        <!-- ==============================
             NEXT MEETING TOPICS
        ============================== -->

        <section>

            <div class="section-title">
                موضوعات جلسه بعد
            </div>

            <div class="description"
                 id="openTopics">
                -
            </div>

        </section>



        <!-- ==============================
             TASKS
        ============================== -->

        <section class="accordion"
                 id="tasksAccordion"
                 style="display:none;">

            <div class="accordion-header">

                <div class="accordion-title">
                    تکالیف
                </div>

                <div class="arrow">
                    ▼
                </div>

            </div>


            <div class="accordion-content"
                 id="tasksContent">
            </div>

        </section>



        <!-- ==============================
             DOCUMENTS
        ============================== -->

        <section class="accordion"
                 id="documentsAccordion"
                 style="display:none;">

            <div class="accordion-header">

                <div class="accordion-title">
                    اسناد
                </div>

                <div class="arrow">
                    ▼
                </div>

            </div>


            <div class="accordion-content">

                <div class="documents"
                     id="documents">
                </div>

            </div>

        </section>



        <!-- ==============================
             TAGS
        ============================== -->

        <section class="section">

            <div class="tags"
                 id="tags">
            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase_client.js"></script>
    <script src="js/common.js"></script>
    <script src="js/report_viewer_sections.js"></script>
    <script src="js/task_study.js"></script>
    <script src="js/task_follow_up.js"></script>
    <script src="js/tasks.js"></script>
    <script src="js/report_viewer.js"></script>





</body>

</html>
